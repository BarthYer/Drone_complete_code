# Enable SPI
CONFIG_SPI=y

# Enable I2C (MPU9250)
CONFIG_I2C=y

# Enable FPU for float math (complementary filter)
CONFIG_FPU=y

# Enable GPIO
CONFIG_GPIO=y

# Enable PWM (MCPWM — 4-motor ESC control)
CONFIG_PWM=y

# Enable logging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# Enable necessary kernel features

# Console and UART for logging
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y

# Disable Bluetooth if not needed
CONFIG_BT=n

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# Enable the driver
#CONFIG_NRF24L01=y

CONFIG_ESP32_USE_UNSUPPORTED_REVISION=y

# ── WiFi ────────────────────────────────────────────────────────────
# WIFI_ESP32 is auto-enabled when DT has wifi/wifi_ap node with status=okay.
# It auto-selects NET_L2_ETHERNET, NET_L2_WIFI_MGMT, MBEDTLS.
CONFIG_WIFI=y
CONFIG_WIFI_NM=y
CONFIG_WIFI_NM_MAX_MANAGED_INTERFACES=2

# ── Net management events ────────────────────────────────────────────
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=10
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048

# Disable auto network config (we set IPs manually in code)
CONFIG_NET_CONFIG_AUTO_INIT=n

# Two IPv4 addresses: one for AP interface, one reserved for STA
CONFIG_NET_IF_MAX_IPV4_COUNT=2

# ── IPv4 TCP/IP stack ────────────────────────────────────────────────
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y

# ── DHCP server (distributes IPs to WiFi clients) ───────────────────
CONFIG_NET_DHCPV4_SERVER=y

# ── Network buffers (sized for WiFi throughput) ──────────────────────
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_NET_BUF_DATA_SIZE=512

# ── Memory / thread stacks ───────────────────────────────────────────
CONFIG_HEAP_MEM_POOL_SIZE=65536
# main() only creates the FSM thread and returns.
CONFIG_MAIN_STACK_SIZE=2048
# Networking threads — defaults are sized for simple scenarios;
# WiFi AP + DHCP + TCP HTTP needs more headroom in every layer.
# Previous crashes (in order): sysworkq (1024), net_socket_service (2400).
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=4096
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_NET_TCP_WORKQ_STACK_SIZE=4096
CONFIG_NET_TX_STACK_SIZE=2048
# Detect stack overflows with a clear "Stack overflow" panic.
CONFIG_STACK_SENTINEL=y

# ── Thread names visible in RTT/UART logs ───────────────────────────
CONFIG_THREAD_NAME=y